    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>PIQ — Box Theory</title>
    <meta name="theme-color" content="#120d0b" />
    <script>
      // Apply the saved theme before first paint (dark by default) so the page never flashes light.
      (function () {
        var theme = 'dark';
        try { theme = localStorage.getItem('piq-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
